<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { 'slate-750': '#1e293b' } } }
    }
  </script>
  <style>
    body { background: #0f172a; overflow-x: hidden; }
    .page-container { max-width: 80vw; margin-left: auto; margin-right: auto; }
    * { box-sizing: border-box; }
    .input { display: block; width: 100%; background: #334155; color: white; border-radius: .5rem; padding: .5rem .75rem; font-size: .875rem; outline: none; border: 1px solid transparent; }
    .input:focus { border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f6; }
    select.input option { background: #1e293b; }
    textarea.input { resize: vertical; }
    .label { display: block; font-size: .75rem; color: #94a3b8; margin-bottom: .25rem; }
    .btn-primary   { display: inline-block; background: #2563eb; color: white; font-weight: 500; padding: .5rem 1rem; border-radius: .5rem; font-size: .875rem; transition: background 150ms; cursor: pointer; border: none; text-decoration: none; text-align: center; }
    .btn-primary:hover   { background: #3b82f6; }
    .btn-secondary { display: inline-block; background: #334155; color: #cbd5e1; font-weight: 500; padding: .5rem 1rem; border-radius: .5rem; font-size: .875rem; transition: background 150ms; cursor: pointer; border: none; text-decoration: none; text-align: center; }
    .btn-secondary:hover { background: #475569; }
    .btn-danger    { display: inline-block; background: rgba(220,38,38,.2); color: #f87171; font-weight: 500; padding: .5rem 1rem; border-radius: .5rem; font-size: .875rem; transition: background 150ms; cursor: pointer; border: none; text-decoration: none; text-align: center; }
    .btn-danger:hover    { background: rgba(220,38,38,.4); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1rem; }
    .modal-box { background: #1e293b; border-radius: 1rem; padding: 1.5rem; width: 100%; max-width: 28rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,.5); max-height: 90vh; overflow-y: auto; }
    /* Collapsible blocks */
    details > summary { list-style: none; cursor: pointer; user-select: none; }
    details > summary::-webkit-details-marker { display: none; }
    details > summary .chevron { transition: transform 200ms; }
    details[open] > summary .chevron { transform: rotate(180deg); }
  </style>
</head>
<body class="text-slate-100 min-h-screen">
  <div id="app"></div>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
